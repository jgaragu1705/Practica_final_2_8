services:

  # Servidor web: Apache + PHP (se construye con el Dockerfile)
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Compartimos TODO el proyecto con el contenedor
      - .:/var/www/html
    depends_on:
      - db

  # Base de datos MySQL
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: practica
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    volumes:
      - db_data:/var/lib/mysql

  # Panel web para ver la base de datos
  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data: