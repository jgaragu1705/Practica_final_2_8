services:

  # Servidor web: Apache + PHP (se construye con el Dockerfile)
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Composer avisa si se ejecuta como root dentro de Docker; con esto se calla
      COMPOSER_ALLOW_SUPERUSER: 1
    # Antes de arrancar Apache, instalo lo de Composer (genera vendor/autoload.php).
    # Así el proyecto funciona aunque se entregue sin la carpeta vendor.
    command: sh -c "composer install --no-interaction && apache2-foreground"
    volumes:
      # Compartimos TODO el proyecto con el contenedor
      - .:/var/www/html
    depends_on:
      - db

  # Base de datos MySQL
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: practica
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    volumes:
      - db_data:/var/lib/mysql
      # MySQL ejecuta todo lo que haya en esta carpeta la PRIMERA vez que se crea la base de datos
      # (:ro = solo lectura, el contenedor no puede modificar mi archivo)
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  # Panel web para ver la base de datos
  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data: